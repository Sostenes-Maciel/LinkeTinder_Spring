spring.application.name=ms-nucleo

# Porta do microsserviço
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/linketinder_nucleo
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Integração com MS-Competencias
integracao.ms-competencias.url=http://localhost:8082